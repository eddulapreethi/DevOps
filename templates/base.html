<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Recipe Organizer{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #25352c;
            --muted: #718076;
            --green: #3f7656;
            --cream: #faf8f1;
            --card: #ffffff;
            --line: #e8e7dc;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--cream);
            color: var(--ink);
            font-family: "Segoe UI", Arial, sans-serif;
            line-height: 1.6;
        }
        a { color: var(--green); }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 18px max(6vw, 24px);
            background: var(--card);
            border-bottom: 1px solid var(--line);
        }
        .brand { color: var(--ink); font-size: 1.2rem; font-weight: 700; text-decoration: none; }
        nav { display: flex; flex-wrap: wrap; gap: 22px; }
        nav a { color: var(--muted); text-decoration: none; font-weight: 600; }
        nav a:hover { color: var(--green); }
        main { width: min(100% - 40px, 1040px); margin: 44px auto 72px; }
        .eyebrow { color: var(--green); font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
        h1, h2, h3 { line-height: 1.2; }
        h1 { margin: 8px 0 14px; font-size: clamp(2rem, 5vw, 3.5rem); }
        h2 { margin-top: 0; }
        .muted { color: var(--muted); }
        .hero {
            padding: clamp(28px, 6vw, 64px);
            border-radius: 24px;
            background: #e8efe5;
        }
        .hero p { max-width: 610px; color: #55675b; font-size: 1.08rem; }
        .button {
            display: inline-block;
            margin: 8px 8px 0 0;
            padding: 11px 18px;
            border: 0;
            border-radius: 8px;
            background: var(--green);
            color: white;
            font: inherit;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }
        .button.secondary { background: white; color: var(--green); border: 1px solid #cad9cc; }
        .section-heading { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin: 38px 0 18px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; }
        .card { padding: 22px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
        .card h3 { margin: 10px 0 6px; }
        .tag { display: inline-block; padding: 4px 10px; border-radius: 20px; background: #eef4eb; color: var(--green); font-size: .83rem; font-weight: 700; }
        .search-form { display: flex; gap: 10px; margin: 22px 0; }
        input, textarea { width: 100%; padding: 11px 12px; border: 1px solid #d8ddd4; border-radius: 8px; background: white; color: var(--ink); font: inherit; }
        textarea { min-height: 110px; resize: vertical; }
        label { display: block; margin: 16px 0 6px; font-weight: 700; }
        .form-card { max-width: 700px; padding: 26px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
        .error { padding: 12px 14px; border-radius: 8px; background: #fff0ed; color: #9f392c; }
        .recipe-meta { display: flex; gap: 12px; align-items: center; margin: 18px 0; }
        .recipe-content { display: grid; grid-template-columns: minmax(200px, .8fr) 1.2fr; gap: 24px; margin-top: 24px; }
        .recipe-content .card { padding: 26px; }
        footer { padding: 24px; border-top: 1px solid var(--line); color: var(--muted); text-align: center; }
        @media (max-width: 620px) {
            .topbar { align-items: flex-start; flex-direction: column; }
            .recipe-content { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{{ url_for('index') }}">Recipe Organizer</a>
        <nav aria-label="Main navigation">
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('recipes') }}">Browse recipes</a>
            <a href="{{ url_for('add_recipe') }}">Add a recipe</a>
        </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer>Plan something delicious, one recipe at a time.</footer>
</body>
</html>
